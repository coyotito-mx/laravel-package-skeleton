name: Release Drafter

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/CHANGELOG.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  draft-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Create Draft Release
        id: draft_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          disable-autolabeler: true
